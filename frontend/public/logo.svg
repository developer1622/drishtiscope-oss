<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="drishti-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ce0cf" />
      <stop offset="100%" stop-color="#00adb5" />
    </linearGradient>
    <linearGradient id="drishti-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="drishti-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3dd68c" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="iris-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ce0cf" stop-opacity="1" />
      <stop offset="70%" stop-color="#00adb5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#07080d" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect width="64" height="64" rx="16" fill="#07080d" />
  <rect width="64" height="64" rx="16" stroke="#1e2430" stroke-width="1.5" />

  <!-- Concentric Telemetry Radar Rings -->
  <circle cx="32" cy="32" r="24" stroke="#1e2430" stroke-width="1" stroke-dasharray="2 3" />
  <circle cx="32" cy="32" r="18" stroke="url(#drishti-green)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 2" />

  <!-- Orbital Kernel Scope Rings (Angled eBPF Rings) -->
  <ellipse cx="32" cy="32" rx="23" ry="11" transform="rotate(-28 32 32)" stroke="url(#drishti-cyan)" stroke-width="1.6" stroke-opacity="0.85" filter="url(#glow)" />
  <ellipse cx="32" cy="32" rx="20" ry="8" transform="rotate(32 32 32)" stroke="url(#drishti-purple)" stroke-width="1.4" stroke-opacity="0.75" />

  <!-- Orbital Signal Nodes -->
  <circle cx="12" cy="22" r="1.5" fill="#3ce0cf" filter="url(#glow)" />
  <circle cx="52" cy="42" r="1.5" fill="#3dd68c" filter="url(#glow)" />
  <circle cx="48" cy="20" r="1.2" fill="#a855f7" />

  <!-- The All-Seeing Vision Eye ("Drishti") -->
  <path d="M16 32C20 23 44 23 48 32C44 41 20 41 16 32Z" stroke="url(#drishti-cyan)" stroke-width="2" stroke-linejoin="round" fill="#0e1118" fill-opacity="0.7" filter="url(#glow)" />

  <!-- Inner Eye Contour -->
  <path d="M21 32C24 26 40 26 43 32C40 38 24 38 21 32Z" stroke="url(#drishti-purple)" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Central Iris & Crosshair Sensor -->
  <circle cx="32" cy="32" r="6" fill="#07080d" stroke="url(#drishti-cyan)" stroke-width="1.5" />
  <circle cx="32" cy="32" r="3.5" fill="url(#iris-glow)" filter="url(#glow)" />
  <circle cx="33" cy="31" r="1.2" fill="#ffffff" />

  <!-- Scope Crosshairs -->
  <line x1="32" y1="21" x2="32" y2="25" stroke="#3ce0cf" stroke-width="1.2" stroke-linecap="round" />
  <line x1="32" y1="39" x2="32" y2="43" stroke="#3ce0cf" stroke-width="1.2" stroke-linecap="round" />
  <line x1="21" y1="32" x2="25" y2="32" stroke="#3ce0cf" stroke-width="1.2" stroke-linecap="round" />
  <line x1="39" y1="32" x2="43" y2="32" stroke="#3ce0cf" stroke-width="1.2" stroke-linecap="round" />
</svg>
